# Separate opt-in RDP checks. Do not enable automatic triggers before
# 2026-12-01: preserve the existing GitHub Actions usage limit policy.
name: Native RDP Windows security checks

on:
  workflow_dispatch:
    inputs:
      include_owner_rdp_tests:
        description: 'Run owner RDP regressions with full app test dependencies'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rdp-windows-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rdp:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RDP test-only packages
        run: python -m pip install "pytest>=8,<10" "cryptography>=43,<47"
      - name: Check Python syntax
        run: python -m compileall -q src/leshy tests
      - name: Native SSPI and RDP protocol regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -q -ra `
            tests/test_native_spnego.py `
            tests/test_native_spnego_windows_buffers.py `
            tests/test_native_spnego_windows_steps.py `
            tests/test_rdp_credssp_tsrequest.py `
            tests/test_rdp_credssp_binding.py `
            tests/test_rdp_credssp_binding_x509.py `
            tests/test_rdp_credssp_negotiator.py `
            tests/test_rdp_credssp_channel.py `
            tests/test_rdp_credssp_channel_loopback.py `
            tests/test_rdp_mcs_basic.py `
            tests/test_rdp_mcs_channel.py `
            tests/test_rdp_mcs_channels.py `
            tests/test_rdp_mcs_channel_join.py `
            tests/test_rdp_client_info.py `
            tests/test_rdp_client_info_channel.py `
            tests/test_rdp_server_activation.py `
            tests/test_rdp_server_activation_channel.py `
            tests/test_rdp_confirm_active.py `
            tests/test_rdp_confirm_active_channel.py `
            tests/test_rdp_finalization.py `
            tests/test_rdp_finalization_channel.py `
            tests/test_rdp_bitmap_update.py `
            tests/test_rdp_bitmap_channel.py `
            tests/test_rdp_bitmap_compositor.py `
            tests/test_rdp_bitmap_surface_wire.py `
            tests/test_rdp_bitmap_compositor_channel.py `
            tests/test_rdp_interleaved_rle.py `
            tests/test_rdp_bitmap_rle_wire.py `
            tests/test_rdp6_planar.py `
            tests/test_rdp6_bitmap_wire.py `
            tests/test_rdp6_ycocg.py `
            tests/test_rdp_graphics_stream.py `
            tests/test_rdp_graphics_stream_channel.py `
            tests/test_rdp_tls_probe.py `
            tests/test_rdp_frame_codec.py `
            tests/test_superagent_rdp_session.py

  owner-rdp:
    if: ${{ inputs.include_owner_rdp_tests == true }}
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Leshy and owner RDP test dependencies
        run: python -m pip install -e ".[test]"
      - name: Reject malformed sources
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m compileall -q src/leshy tests
          python -c "from pathlib import Path; paths=list(Path('src/leshy').rglob('*.py'))+list(Path('tests').rglob('*.py')); bad=[str(p) for p in paths if b'\x00' in p.read_bytes()]; assert not bad, f'Python source contains NUL: {bad}'"
          node --check web/superagent-dashboard.js
      - name: Verify SuperAgent RDP owner and Stop regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -q -ra `
            tests/test_rdp_credssp_channel.py `
            tests/test_rdp_credssp_channel_loopback.py `
            tests/test_rdp_vision_bridge.py `
            tests/test_rdp_local_vision.py `
            tests/test_rdp_vision_worker.py `
            tests/test_rdp_cognitive_bridge.py `
            tests/test_superagent_rdp_cognitive_runtime.py `
            tests/test_superagent_rdp_live_registry.py `
            tests/test_superagent_rdp_png_web.py `
            tests/test_superagent_native_rdp_launcher.py `
            tests/test_superagent_rdp_launch_approval.py `
            tests/test_superagent_rdp_credentials.py `
            tests/test_superagent_rdp_intent.py
