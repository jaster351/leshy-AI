# Временно только ручной запуск до 2026-12-01 (лимиты GitHub Actions).
name: Leshy Windows Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: leshy-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Validate Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          foreach ($file in @(
            '.\windows\autobuilder.ps1',
            '.\windows\autobuilder-core.ps1',
            '.\windows\autobuilder-ui.ps1',
            '.\windows\autobuilder-ui-v3.ps1',
            '.\windows\publish-build-logs.ps1'
          )) {
            $path = (Resolve-Path $file).Path
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$file must stay ASCII-only for Windows PowerShell 5.1 compatibility."
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell 5.1 parser rejected $file."
            }
          }
          Get-Content '.\windows\autobuilder-ui.ru.json' -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
      - name: Версия
        id: version
        shell: pwsh
        run: |
          $v=(Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') { throw "Некорректная версия в VERSION: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Сборка и frozen smoke-test
        shell: pwsh
        run: ./windows/build.ps1
      - name: Проверить установщик
        shell: pwsh
        run: |
          $p="dist/LeshySetup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $p)) { throw "Не найден $p" }
          Get-Item $p | Format-List Name,Length,LastWriteTime
          Get-FileHash $p -Algorithm SHA256 | Format-List
      - name: Дождаться успешного Linux CI для того же коммита
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headSha = '${{ github.sha }}'
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $json = gh api "repos/${{ github.repository }}/actions/runs?head_sha=$headSha&per_page=20" | ConvertFrom-Json
            $run = $json.workflow_runs | Where-Object { $_.name -eq 'Leshy AI CI' } | Select-Object -First 1
            if ($null -eq $run) {
              Write-Host 'Linux CI: missing'
            } else {
              Write-Host "Linux CI: $($run.status):$($run.conclusion)"
              if ($run.status -eq 'completed' -and $run.conclusion -eq 'success') { exit 0 }
              if ($run.status -eq 'completed') { exit 1 }
            }
            Start-Sleep -Seconds 10
          }
          throw 'Linux CI did not complete successfully in time'
      - name: Опубликовать проверенный Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $asset = "dist/LeshySetup-$version.exe"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo '${{ github.repository }}' --clobber
          } else {
            gh release create $tag $asset --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Леший $version" --notes "Проверенный релиз Лешего $version. Перед публикацией успешно пройдены Linux CI, Windows frozen smoke-test и проверка установщика."
          }
