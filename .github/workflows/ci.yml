name: Leshy AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установить CPU llama.cpp runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "llama-cpp-python>=0.3.27,<0.4" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Установить Лешего и тестовые зависимости
        run: pip install -e ".[test]"
      - name: Проверить Python
        run: python -m compileall -q src tests windows
      - name: Проверить импорт рабочего runtime
        run: python -c "from leshy.app import LeshyApp; from leshy.runtime import Runtime; from leshy.web_server import make_handler"
      - name: Запустить unit и regression тесты
        run: python -m unittest discover -s tests -v
      - name: Проверить Web JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('web/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',html,re.S)
          assert m, 'script не найден'
          Path('/tmp/leshy-web.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/leshy-web.js
          node --check web/browser-approval-panel.js
          node --check web/marketplace-panel.js
          node --check web/module-settings-panel.js
      - name: Проверить UI 4→3 и самообучение
        run: |
          grep -q 'Я здесь. Слушаю. Думаю. Помогаю.' web/index.html
          grep -q 'document.body.classList.add' web/index.html
          grep -q '/v1/learning' web/index.html
          grep -q '/v1/telegram/config' web/index.html
      - name: Проверить долговременную память
        run: |
          grep -q '/remember ' src/leshy/app.py
          grep -q 'test_explicit_memory_is_persistent_and_isolated' tests/test_app_runtime.py
