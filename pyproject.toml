[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leshy-ai"
dynamic = ["version"]
description = "Леший — локальный автономный AI-ассистент"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-2.0-only"}
authors = [{name = "Тихонов Михаил Викторович"}]
dependencies = [
  "ddgs>=9,<10",
  "tzdata>=2025.2",
  "yt-dlp>=2026.10.26,<2027",
  "faster-whisper>=1.2,<2",
  "av>=11,<19",
  "pypdf>=6,<7",
  "playwright>=1.55,<2",
  "huggingface_hub>=0.36,<2",
  "hf_xet>=1.1,<2",
]

[project.optional-dependencies]
native = ["llama-cpp-python>=0.3.27,<0.4"]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<9"]

[project.scripts]
leshy = "leshy.web_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "leshy.version.VERSION"}
